<!DOCTYPE html>
<!-- SI-assisted: generated with Codex, reviewed and aligned by Esquivel & Elias — [PROJECT_NAME] -->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | [PROJECT_NAME] — Microgravity Fire Simulation</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #060d15;
        color: #c7d9eb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body.embedded #unity-container.unity-desktop {
        left: 0;
        top: 0;
        transform: none;
        width: 100%;
        height: 100%;
      }
      body.embedded #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      body.embedded #unity-footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">[PROJECT_NAME] — Microgravity Fire Simulation</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isEmbedded = window.self !== window.top || new URLSearchParams(window.location.search).get("embed") === "1";
      if (isEmbedded) {
        document.body.classList.add("embedded");
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGlSimulation.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGlSimulation.data.br",
        frameworkUrl: buildUrl + "/WebGlSimulation.framework.js.br",
        codeUrl: buildUrl + "/WebGlSimulation.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "[PROJECT_NAME] Fire Simulation",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else if (!isEmbedded) {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
          var lastChamberPhase = null;
          window.addEventListener("message", function(event) {
            if (!event.data) return;
            if (event.data.type === "APPLY_FIRE_PAYLOAD" && event.data.payload) {
              var jsonStr = typeof event.data.payload === "string"
                ? event.data.payload
                : JSON.stringify(event.data.payload);
              lastChamberPhase = null;
              unityInstance.SendMessage("FireSimulation", "ApplyJson", jsonStr);
            } else if (event.data.type === "APPLY_CHAMBER_STATE") {
              var nextPhase = event.data.phase || null;
              if (nextPhase === "suppressing" && lastChamberPhase !== "suppressing") {
                unityInstance.SendMessage("Fire Extinguisher", "UseExtinguisher");
              } else if (nextPhase === "burning" && lastChamberPhase === "extinguished") {
                unityInstance.SendMessage("FireSimulation", "ResetSuppression");
              }
              lastChamberPhase = nextPhase;
            } else if (event.data.type === "TOGGLE_TELEMETRY" && typeof unityInstance.SetShowTelemetry === "function") {
              unityInstance.SetShowTelemetry(Boolean(event.data.show));
            }
          });
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "UNITY_FIRE_SIMULATION_READY" }, "*");
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
